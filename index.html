<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مسابقة الاحسان في حفظ القرآن الكريم</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Excel + PDF -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --primary:#1d4ed8; --primary2:#2563eb; --bg:#f5f7fb; --card:#fff;
  --text:#172033; --muted:#64748b; --border:#e2e8f0; --success:#15803d;
  --danger:#b91c1c; --warning:#b45309; --shadow:0 8px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0f172a;color:#fff;padding:20px 14px;position:fixed;right:0;top:0;bottom:0;z-index:20}
.brand{padding:8px 12px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.brand h1{font-size:20px;margin:0 0 6px}
.brand p{font-size:12px;color:#cbd5e1;margin:0}
.nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:right;padding:13px 14px;border-radius:10px;margin:3px 0}
.nav button:hover,.nav button.active{background:#1e293b;color:#fff}
.main{margin-right:250px;width:calc(100% - 250px);padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.topbar h2{margin:0;font-size:25px}
.status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);padding:18px}
.stat{display:flex;justify-content:space-between;align-items:center}
.stat .num{font-size:30px;font-weight:bold;margin-top:7px}
.stat .label{font-size:13px;color:var(--muted)}
.icon{width:45px;height:45px;border-radius:12px;background:#eff6ff;display:grid;place-items:center;font-size:21px}
.section{display:none}
.section.active{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:bold}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:#1e40af}
.btn.secondary{background:#e2e8f0;color:#172033}
.btn.success{background:#dcfce7;color:#166534}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.warning{background:#fef3c7;color:#92400e}
.btn:disabled{opacity:.55;cursor:not-allowed}
.search{flex:1;min-width:240px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:right;font-size:13px;white-space:nowrap}
th{background:#f8fafc;color:#475569;position:sticky;top:0;z-index:1}
tr:hover td{background:#fafcff}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:bold}
.badge.success{background:#dcfce7;color:#166534}.badge.danger{background:#fee2e2;color:#991b1b}
.badge.warning{background:#fef3c7;color:#92400e}.badge.info{background:#dbeafe;color:#1d4ed8}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;padding:20px;overflow:auto}
.modal.show{display:block}
.modal-box{background:#fff;max-width:1000px;margin:20px auto;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.2);overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0}
.modal-body{padding:20px}
.close{border:0;background:#f1f5f9;border-radius:8px;width:38px;height:38px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field label{display:block;font-size:12px;color:#475569;margin-bottom:6px;font-weight:bold}
.field.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:18px}
.test-box{background:#f8fafc;border:1px solid var(--border);padding:16px;border-radius:14px;margin-top:15px}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.score-total{font-size:28px;font-weight:bold;text-align:center;padding:15px;background:#eff6ff;border-radius:12px;color:#1d4ed8}
.empty{text-align:center;color:var(--muted);padding:35px}
.notice{padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:14px}
.danger-note{background:#fff7ed;color:#9a3412}
.file-input{display:none}
.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.report-box{padding:14px;background:#f8fafc;border-radius:12px;text-align:center}
.report-box b{display:block;font-size:23px;margin-top:4px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:100;display:none;place-items:center}
.loading.show{display:grid}
.spinner{width:42px;height:42px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:20px;bottom:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;z-index:200;display:none;max-width:380px}
.toast.show{display:block}
.login{min-height:100vh;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a);padding:20px}
.login-card{width:min(460px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.25);text-align:center}
.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted);line-height:1.7}
